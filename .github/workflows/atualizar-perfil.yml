name: atualizar perfil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - perfil.json
      - scripts/**
      - .github/workflows/atualizar-perfil.yml

permissions:
  contents: write

concurrency:
  group: atualizar-perfil
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gerar README e imagens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/atualizar.py

      - name: publicar se mudou
        run: |
          git add README.md assets
          if git diff --cached --quiet; then
            echo "nada mudou"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza perfil a partir dos repositórios"
          git push
